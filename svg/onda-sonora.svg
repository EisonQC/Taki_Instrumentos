<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .barra { fill: #d9a441; }
    @keyframes ecualizar {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }
    .barra { transform-box: fill-box; transform-origin: center; animation: ecualizar 1.1s ease-in-out infinite; }
    .b2 { animation-delay: 0.15s; }
    .b3 { animation-delay: 0.3s; }
    .b4 { animation-delay: 0.45s; }
    .b5 { animation-delay: 0.6s; }
    .b6 { animation-delay: 0.75s; }
    .b7 { animation-delay: 0.9s; }
  </style>
  <rect class="barra b1" x="5"   y="20" width="14" height="40" rx="3"/>
  <rect class="barra b2" x="30"  y="10" width="14" height="60" rx="3"/>
  <rect class="barra b3" x="55"  y="26" width="14" height="28" rx="3"/>
  <rect class="barra b4" x="80"  y="4"  width="14" height="72" rx="3"/>
  <rect class="barra b5" x="105" y="18" width="14" height="44" rx="3"/>
  <rect class="barra b6" x="130" y="12" width="14" height="56" rx="3"/>
  <rect class="barra b7" x="155" y="24" width="14" height="32" rx="3"/>
  <rect class="barra b8" x="180" y="8"  width="14" height="64" rx="3"/>
</svg>
